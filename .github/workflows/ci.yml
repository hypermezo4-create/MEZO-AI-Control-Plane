name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: mezo
          POSTGRES_PASSWORD: mezo-test-only
          POSTGRES_DB: mezo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mezo -d mezo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
      DATABASE_TEST_URL: postgresql+asyncpg://mezo:mezo-test-only@localhost:5432/mezo_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: python scripts/verify_migrations.py
      - run: pytest -q tests/unit
      - run: pytest -q tests/security
      - run: pytest -q tests/integration
      - run: pytest -q tests/contract
      - run: pytest -q tests/end_to_end
      - run: mezo-evals
      - run: pytest -q
      - run: python -m compileall -q src tests scripts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          load: true
          tags: mezo-ai-control-plane:${{ github.sha }}
      - name: Run Docker sandbox security contract
        run: >-
          docker run --rm --network=none --read-only --user=10001:10001
          --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64
          mezo-ai-control-plane:${{ github.sha }}
          python -c "import os; assert os.getuid() == 10001"
