name: Deploy Fly

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to authorize the production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-fly
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy with release migration and rolling strategy
        run: flyctl deploy --remote-only --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify Fly machine checks
        run: flyctl checks list --app mezo-ai-control-plane
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify public health endpoints
        run: |
          curl --fail --show-error --silent --output /dev/null https://mezo-ai-control-plane.fly.dev/health/live
          curl --fail --show-error --silent --output /dev/null https://mezo-ai-control-plane.fly.dev/health/ready
      - name: Verify authenticated control surfaces
        run: |
          curl --fail --show-error --silent --output /dev/null --header "x-api-key: ${CONTROL_PLANE_API_KEY}" "https://mezo-ai-control-plane.fly.dev/v1/tasks?offset=0&limit=1"
          curl --fail --show-error --silent --output /dev/null --header "x-api-key: ${CONTROL_PLANE_API_KEY}" https://mezo-ai-control-plane.fly.dev/v1/observability/alerts
          curl --fail --show-error --silent --output /dev/null --header "x-api-key: ${CONTROL_PLANE_API_KEY}" https://mezo-ai-control-plane.fly.dev/metrics
        env:
          CONTROL_PLANE_API_KEY: ${{ secrets.CONTROL_PLANE_API_KEY }}
