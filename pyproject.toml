[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mezo-ai-control-plane"
version = "0.1.0"
description = "Cloud control plane for evidence-driven coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "structlog>=25,<26",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
mezo-api = "mezo_control_plane.api.main:run"
mezo-worker = "mezo_control_plane.worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mezo_control_plane"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S104"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mezo_control_plane"]
